<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استادیاب | جستجوی شماره تماس اساتید</title>
  
  <!-- پیش‌بارگذاری آنی فونت‌ها برای حذف تاخیر تغییر فونت -->
  <link rel="preload" href="fonts/m-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/m-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/m-ExtraBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/ch.ttf" as="font" type="font/ttf" crossorigin>

  <!-- پیش‌بارگذاری آنی تصاویر کلیدی -->
  <link rel="preload" as="image" href="images/logo.webp">
  <link rel="preload" as="image" href="images/marakez.webp">
  <link rel="preload" as="image" href="images/ertebat.webp">
  <link rel="preload" as="image" href="images/poshtibanan.webp">
  <link rel="preload" as="image" href="images/ozviat.webp">
  <link rel="preload" as="image" href="images/mypnu.webp">
  <link rel="preload" as="image" href="images/cat1.webp">
  <link rel="preload" as="image" href="images/cat2.webp">
  <link rel="preload" as="image" href="images/cat00.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    html {
      scroll-behavior: smooth;
      touch-action: pan-x pan-y;
    }

    @font-face {
      font-family: 'AppFont';
      src: url('fonts/m-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'AppFont';
      src: url('fonts/m-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'AppFont';
      src: url('fonts/m-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'AppFont';
      src: url('fonts/m-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'AppFont';
      src: url('fonts/m-Black.ttf') format('truetype');
      font-weight: 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'AppFont';
      src: url('fonts/m-ExtraBlack.ttf') format('truetype');
      font-weight: 950;
      font-style: normal;
      font-display: block;
    }

    @font-face {
      font-family: 'CustomChFont';
      src: url('fonts/ch.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: block;
    }

    :root {
      --bg-dark-1: #1e053a;
      --bg-dark-2: #2e0854;
      --bg-dark-3: #4a157a;
      --bg-dark-4: #22033d;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'AppFont', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: pan-x pan-y;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-dark-1) 0%, var(--bg-dark-2) 35%, var(--bg-dark-3) 70%, var(--bg-dark-4) 100%);
      background-size: 240% 240%;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 0px;
      padding-bottom: 0px;
      overflow-x: hidden;
      font-weight: 400;
    }

    .top-nav {
      position: relative;
      width: 100%;
      height: 40px;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0,0,0,0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      z-index: 100;
      flex-shrink: 0;
      border-bottom: 2.2px solid transparent;
      border-image: linear-gradient(90deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%) 1;
    }

    .brand-title {
      color: #1a1a2e;
      font-weight: 700;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .brand-title span.author {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      letter-spacing: 1.2px;
      color: #5a189a;
      font-size: 14.5px;
      white-space: nowrap;
    }

    .top-links {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 76px;
      height: 25px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }

    .nav-btn:active {
      transform: scale(0.94);
    }

    .nav-btn.eitaa {
      background: linear-gradient(135deg, #e65100, #f57c00);
      color: #fff;
    }

    .nav-btn.telegram {
      background: linear-gradient(135deg, #0088cc, #00c6ff);
      color: #fff;
    }

    .custom-nav-icon {
      width: 14px;
      height: 14px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
    }

    .main-container {
      width: 92%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1 0 auto;
      padding-top: 36px;
      padding-bottom: 35px;
    }

    .brand-hero {
      width: 100%;
      max-width: 550px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      margin-bottom: 2px;
    }

    .hero-logo-img {
      width: 46%;
      max-width: 240px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(216, 180, 254, 0.45));
      transition: transform 0.3s ease;
    }

    .hero-logo-img:hover {
      transform: scale(1.02);
    }

    .subtitle-glass-capsule {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(46, 8, 84, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.2px solid #ffd166;
      border-radius: 8px;
      padding: 3px 14px;
      margin-top: 12px;
      margin-bottom: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3), 0 0 10px rgba(255, 209, 102, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .subtitle-glass-capsule::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -80%;
      width: 50%;
      height: 220%;
      background: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.08) 25%,
        rgba(255, 235, 179, 0.55) 50%,
        rgba(255, 255, 255, 0.08) 75%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(24deg);
      pointer-events: none;
      animation: capsuleShineGlow 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes capsuleShineGlow {
      0% {
        left: -90%;
        opacity: 0;
      }
      10% {
        opacity: 0.95;
      }
      38% {
        left: 140%;
        opacity: 0.95;
      }
      45%, 100% {
        left: 140%;
        opacity: 0;
      }
    }

    .hero-subtitle-text {
      font-size: 10.5px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.1px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 1;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin-bottom: 25px;
    }

    .search-input-box {
      width: 100%;
      height: 56px;
      background: #ffffff;
      border: 2.5px solid transparent;
      border-radius: 36px;
      padding: 0 66px 0 52px;
      font-size: 17px;
      font-weight: 600;
      color: #2b004a;
      outline: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.32);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      user-select: text;
    }

    .search-input-box::placeholder {
      font-family: 'AppFont', sans-serif;
      font-weight: 400;
      font-size: 16px;
      color: #8f7f9f;
    }

    .search-input-box:focus {
      border-color: #d8b4fe;
      box-shadow: 0 8px 28px rgba(199, 125, 255, 0.5);
    }

    .search-sticker-box {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      max-height: calc(100% - 6px);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      perspective: 600px;
      overflow: hidden;
    }

    .sticker-cat {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease;
      will-change: transform, opacity;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.2));
    }

    .sticker-cat.cat-1 {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .sticker-cat.cat-2 {
      opacity: 0;
      transform: scale(0.6) rotate(-20deg) translateY(12px);
    }

    .search-wrapper.is-focused .sticker-cat.cat-1 {
      opacity: 0;
      transform: scale(0.6) rotate(20deg) translateY(-12px);
    }

    .search-wrapper.is-focused .sticker-cat.cat-2 {
      opacity: 1;
      transform: scale(1) rotate(0deg) translateY(0);
    }

    .clear-search-btn {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      background: #ff4d6d;
      border-radius: 50%;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13.5px;
      z-index: 2;
    }

    .home-actions-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .home-actions-wrapper.hidden-searching {
      display: none !important;
    }

    .quick-actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }

    /* قابلیت کلیک مستقیم روی کل اسلایدها و کارت‌ها */
    .ratio-10-7-card, .ratio-24-7-card {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 24px;
      overflow: hidden;
      display: block;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: box-shadow 0.3s ease, border-color 0.3s ease, transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .ratio-10-7-card:active, .ratio-24-7-card:active {
      transform: scale(0.975);
    }

    .ratio-10-7-card {
      aspect-ratio: 10 / 7;
    }

    .ratio-24-7-card {
      width: 100%;
      aspect-ratio: 24 / 7;
    }

    .card-marakez {
      background-image: url('images/marakez.webp');
      border: 1.5px solid rgba(255, 42, 81, 0.85);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 15px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(255, 0, 85, 0.15);
    }
    .card-marakez:hover {
      border-color: #ff2a51;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 24px rgba(255, 42, 81, 0.6), inset 0 0 14px rgba(255, 42, 81, 0.25);
    }

    .card-ertebat {
      background-image: url('images/ertebat.webp');
      border: 1.5px solid rgba(0, 240, 255, 0.85);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .card-ertebat:hover {
      border-color: #00f0ff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 26px rgba(0, 240, 255, 0.65);
    }

    .card-poshtibanan {
      background-image: url('images/poshtibanan.webp');
      border: 1.5px solid rgba(6, 214, 160, 0.85);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 16px rgba(6, 214, 160, 0.3), inset 0 0 10px rgba(6, 214, 160, 0.15);
    }
    .card-poshtibanan:hover {
      border-color: #06d6a0;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 26px rgba(6, 214, 160, 0.65), inset 0 0 14px rgba(6, 214, 160, 0.3);
    }

    .card-ozviat {
      background-image: url('images/ozviat.webp');
      border: 1.5px solid rgba(255, 133, 0, 0.85);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 16px rgba(255, 109, 0, 0.3), inset 0 0 10px rgba(255, 109, 0, 0.15);
    }
    .card-ozviat:hover {
      border-color: #ff8500;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 26px rgba(255, 133, 0, 0.65), inset 0 0 14px rgba(255, 133, 0, 0.3);
    }

    .card-mypnu {
      background-image: url('images/mypnu.webp');
      border: 1.5px solid rgba(255, 209, 102, 0.9);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 0 16px rgba(255, 209, 102, 0.35), inset 0 0 10px rgba(255, 209, 102, 0.18);
    }
    .card-mypnu:hover {
      border-color: #ffd166;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45), 0 0 26px rgba(255, 209, 102, 0.7), inset 0 0 14px rgba(255, 209, 102, 0.3);
    }

    .card-corner-btn {
      position: absolute;
      bottom: 12px;
      left: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 10px;
      border: none;
      font-size: 12.5px;
      font-weight: 900;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      transition: transform 0.2s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.2s ease, filter 0.2s ease;
      z-index: 5;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      outline: none;
    }

    .aligned-action-btn {
      width: 98px;
      height: 33px;
      left: 14px;
      bottom: 12px;
      padding: 0 8px;
    }

    .card-corner-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      filter: brightness(1.06);
    }

    .card-corner-btn:active {
      transform: translateY(1px) scale(0.95);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      filter: brightness(0.96);
    }

    .triple-arrow {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      direction: ltr;
    }

    .arrow-tick {
      display: inline-flex;
      font-size: 10px;
      opacity: 0.75;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .card-corner-btn:hover .arrow-tick {
      opacity: 1;
      transform: translateX(-2px);
    }

    .btn-marakez { background: #e63956; color: #ffffff; }
    .btn-ertebat { background: #0099b8; color: #ffffff; }
    .btn-poshtibanan { background: #059669; color: #ffffff; }
    .btn-ozviat { background: #e65100; color: #ffffff; }
    .btn-mypnu-solid { background: #ffb703; color: #111111 !important; font-weight: 950; }
    .btn-mypnu-solid .arrow-tick { color: #111111 !important; }

    .results-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .result-card {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid var(--glass-border);
      border-radius: 26px;
      padding: 24px 20px 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.4s ease;
      animation: fadeIn 0.3s ease forwards;
    }

    .result-card.glow-green {
      border-color: #06d6a0 !important;
      box-shadow: 0 0 24px rgba(6, 214, 160, 0.7) !important;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
    }

    .prof-name {
      font-size: 21px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .prof-name.glow-text-green {
      color: #06d6a0 !important;
      text-shadow: 0 0 10px rgba(6, 214, 160, 0.8) !important;
    }

    .contact-glass-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4), 0 4px 18px rgba(157, 78, 221, 0.2);
      border-radius: 14px;
      padding: 8px 20px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      direction: ltr;
      max-width: 95%;
      transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .contact-glass-pill.glow-pill-green {
      border-color: #06d6a0 !important;
      box-shadow: 0 0 14px rgba(6, 214, 160, 0.5), inset 0 0 6px rgba(6, 214, 160, 0.2) !important;
      background: rgba(6, 214, 160, 0.08) !important;
    }

    .contact-glass-pill i {
      font-size: 19px;
      color: #e0aaff;
      flex-shrink: 0;
      transition: color 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .contact-glass-pill.glow-pill-green i {
      color: #06d6a0 !important;
    }

    .pill-eitaa-icon {
      width: 19px;
      height: 19px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .contact-digits {
      font-size: 19.5px;
      font-weight: 600;
      letter-spacing: 1.2px;
      color: #00f0ff;
      line-height: 1;
      text-shadow: 0 0 6px rgba(0, 240, 255, 0.35);
      display: flex;
      align-items: center;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .contact-digits.copied-glow {
      color: #06d6a0 !important;
      text-shadow: 0 0 10px rgba(6, 214, 160, 0.8) !important;
    }

    .contact-eitaa-id {
      font-family: 'Montserrat', sans-serif !important;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #ffd166;
      text-shadow: 0 0 8px rgba(255, 209, 102, 0.35);
      white-space: nowrap !important;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
      display: inline-block;
      vertical-align: middle;
      line-height: 1.2;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .contact-eitaa-id.group-label-text {
      font-family: 'AppFont', sans-serif !important;
      font-size: 13.5px;
      letter-spacing: 0.2px;
      color: #ffd166;
      direction: rtl;
    }

    .contact-eitaa-id.copied-glow {
      color: #06d6a0 !important;
      text-shadow: 0 0 12px rgba(6, 214, 160, 0.85) !important;
    }

    .card-actions {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
    }

    .prof-presence-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 520px;
      margin-top: 12px;
      padding: 8px 14px;
      background: #0f766e;

    function toPersianDigits(num) {
      if (num === null || num === undefined) return '';
      const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      return num.toString().replace(/\d/g, x => persianDigits[x]);
    }

    function cleanPersianString(str) {
      if (!str) return '';
      return str
        .toLowerCase()
        .replace(/[يىئ]/g, 'ی')
        .replace(/ك/g, 'ک')
        .replace(/[آأإء]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/[\u200c\u200b\u200e\u200f]/g, '')
        .replace(/[\u064B-\u0652]/g, '')
        .replace(/[۰٠]/g, '0').replace(/[۱١]/g, '1').replace(/[۲٢]/g, '2')
        .replace(/[۳٣]/g, '3').replace(/[۴٤]/g, '4').replace(/[۵٥]/g, '5')
        .replace(/[۶٦]/g, '6').replace(/[۷٧]/g, '7').replace(/[۸٨]/g, '8')
        .replace(/[۹٩]/g, '9')
        .replace(/["'«»()]/g, ' ')
        .trim();
    }

    function removeAllSpaces(str) {
      return cleanPersianString(str).replace(/\s+/g, '');
    }

    const stopWordsList = new Set(['استاد', 'دکتر', 'اقای', 'اقا', 'خانم', 'سید', 'سیده', 'مهندس']);

    function getCleanTokens(str) {
      const cleaned = cleanPersianString(str);
      return cleaned.split(/\s+/).filter(token => token.length > 0 && !stopWordsList.has(token));
    }

    function robustCopyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      }
      return fallbackCopy(text);
    }

    function fallbackCopy(text) {
      return new Promise((resolve, reject) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        textArea.setAttribute("readonly", "");
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, 99999);
        try {
          const successful = document.execCommand('copy');
          document.body.removeChild(textArea);
          if (successful) resolve();
          else reject();
        } catch (err) {
          document.body.removeChild(textArea);
          reject(err);
        }
      });
    }

          for (let i = 0; i < p.tokens.length; i++) {
            const currentToken = queryTokens[tokenIndex];
            if (p.tokens[i].startsWith(currentToken) || (currentToken.length > 2 && p.tokens[i].includes(currentToken))) {
              tokenIndex++;
              if (tokenIndex === queryTokens.length) {

        const icon = btnElement.querySelector('i');
        const originalText = span ? span.getAttribute('data-origin') || span.innerText : 'کپی کردن';

        if (span && !span.getAttribute('data-origin')) {
          span.setAttribute('data-origin', originalText);

        }

        if (pillElement) pillElement.classList.add('glow-pill-green');
        if (titleElement) titleElement.classList.add('glow-text-green');
        if (digitsElement) digitsElement.classList.add('copied-glow');
        if (eitaaIconImg) eitaaIconImg.src = 'images/eitaa-green.webp';

        btnElement.classList.add('copied');
        if (span) span.innerText = 'کپی شد';
        if (icon) icon.className = 'fa-solid fa-check';

        btnElement._timer = setTimeout(() => {
          if (searchCard) {
            searchCard.classList.remove('glow-green');
          }
          if (pillElement) pillElement.classList.remove('glow-pill-green');
          if (titleElement) titleElement.classList.remove('glow-text-green');
          if (digitsElement) digitsElement.classList.remove('copied-glow');
          if (eitaaIconImg) eitaaIconImg.src = 'images/eitaa-orange.webp';

          btnElement.classList.remove('copied');
          if (span) span.innerText = originalText;
          if (icon) icon.className = 'fa-regular fa-copy';
          btnElement._timer = null;
        }, 1800);
      });
    };
  </script>
</body>
</html>
