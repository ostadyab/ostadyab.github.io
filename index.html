<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه نمایش تصویر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(-45deg, #0d021f, #1f0640, #340b6b, #14032b);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .center-image {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
            display: block;
            animation: glitch 3.5s infinite;
        }

        @keyframes glitch {
            0%, 84%, 100% {
                transform: translate(0, 0) skew(0deg);
                filter: none;
                clip-path: inset(0 0 0 0);
            }
            85% {
                transform: translate(-5px, 2px) skew(-4deg);
                filter: drop-shadow(3px 0 0 rgba(255, 0, 85, 0.85)) drop-shadow(-3px 0 0 rgba(0, 255, 255, 0.85));
                clip-path: inset(15% 0 40% 0);
            }
            87% {
                transform: translate(5px, -2px) skew(4deg);
                filter: drop-shadow(-3px 0 0 rgba(255, 0, 85, 0.85)) drop-shadow(3px 0 0 rgba(0, 255, 255, 0.85));
                clip-path: inset(50% 0 15% 0);
            }
            89% {
                transform: translate(-3px, -1px) skew(-2deg);
                filter: hue-rotate(90deg) contrast(1.4);
                clip-path: inset(0 0 0 0);
            }
            91% {
                transform: translate(4px, 1px) skew(3deg);
                filter: drop-shadow(4px 0 0 rgba(0, 255, 255, 0.9)) drop-shadow(-4px 0 0 rgba(255, 0, 85, 0.9));
                clip-path: inset(25% 0 30% 0);
            }
            93% {
                transform: translate(-2px, 2px);
                filter: none;
                clip-path: inset(0 0 0 0);
            }
        }
    </style>
</head>
<body>

    <img src="image/a.webp" alt="تصویر" class="center-image">

</body>
</html>
