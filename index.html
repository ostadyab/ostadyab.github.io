        :root {
            --font-fa: 'Morabba', 'Vazirmatn', sans-serif;
            --font-handwritten: 'Morabba', 'Lalezar', cursive, system-ui;
            --font-en: 'Montserrat', sans-serif;
            --font-en-fancy: 'Shutterlocks', 'Permanent Marker', cursive;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-fa);
            min-height: 100vh;
            background: #0b001a;
            color: #ffffff;
            overflow-x: hidden;
            padding-bottom: 60px;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(-45deg, #0b001a, #1a0845, #081b4b, #12032e, #031e42);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            will-change: background-position;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating background orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
            will-change: transform;
            transform: translateZ(0);
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: #7928ca;
            top: -40px;
            left: -40px;
            animation: floatOrb 18s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: #0070f3;
            bottom: 10%;
            right: -80px;
            animation: floatOrb 22s ease-in-out infinite alternate-reverse;
        }
        .orb-3 {
            width: 250px;
            height: 250px;
            background: #ff0080;
            top: 40%;
            left: 15%;
            animation: floatOrb 15s ease-in-out infinite alternate;
        }

        @keyframes floatOrb {
            0% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(40px, 50px, 0); }
            100% { transform: translate3d(-30px, 30px, 0); }
        }

        /* Top Sticky Header */
        .top-navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background: #ffffff;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
            padding: 10px 20px;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transform: translateZ(0);
        }

        .creator-title {
            font-family: var(--font-fa);
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 8px;
            direction: rtl;
        }

        .armoon-brand {
            font-family: var(--font-en);
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            direction: ltr;
            background: linear-gradient(90deg, #5b06a8, #0d47a1, #6a1b9a, #005bb5);
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textFlow 4s linear infinite;
        }

        .top-navbar-btns {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 220px;
            margin-top: 8px;
        }

        .top-navbar-btn {
            flex: 1;
            text-align: center;
            padding: 5px 8px;
            border-radius: 12px;
            font-family: var(--font-en);
            font-weight: 800;
            font-size: 0.7rem;
            letter-spacing: 0.3px;
            color: #ffffff;
            text-decoration: none;
            direction: ltr;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .top-navbar-btn:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .btn-eitaa-top {
            background: linear-gradient(135deg, #ff9500, #ff5e00);
        }

        .btn-telegram-top {
            background: linear-gradient(135deg, #29b6f6, #0d47a1);
        }

        .gradient-text-dynamic {
            background: linear-gradient(90deg, #5b06a8, #0d47a1, #6a1b9a, #005bb5);
            background-size: 250% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textFlow 4s linear infinite;
        }

        @keyframes textFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .heart-beat {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .heart-svg {
            width: 22px;
            height: 20px;
            animation: pulseHeart 1.1s cubic-bezier(0.215, 0.61, 0.355, 1) infinite,
                       glowPulse 2s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes glowPulse {
            0%, 100% {
                filter: drop-shadow(0 0 2px rgba(255, 120, 120, 0.6)) drop-shadow(0 0 5px rgba(255, 0, 0, 0.35));
            }
            50% {
                filter: drop-shadow(0 0 8px rgba(255, 40, 40, 0.95)) drop-shadow(0 0 16px rgba(200, 0, 0, 0.7));
            }

        const resultsContainer = document.getElementById('resultsContainer');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            clearSearchBtn.classList.toggle('visible', e.target.value.length > 0);
            renderResults(query);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.remove('visible');
            renderResults('');
            searchInput.focus();
        });

        function renderResults(query) {
            if (!query) {
                resultsContainer.innerHTML = '';
                return;
            }

            const normQuery = normalizeText(query);
            let filtered = professorsData.filter(prof => prof.normName.includes(normQuery));

            if (filtered.length === 0) {
                const words = normQuery.split(' ').filter(Boolean);
                if (words.length > 1) {
                    const lastName = words[words.length - 1];
                    filtered = professorsData.filter(prof => prof.normName.includes(lastName));
                }
            }

            if (filtered.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-result">
                        استادی با نام <strong>"${escapeHtml(query)}"</strong> یافت نشد.
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(prof => {
                html += `
                    <div class="prof-card">
                        <div class="prof-name">${escapeHtml(prof.name)}</div>
                        <div class="contact-group">
                `;

                prof.contacts.forEach(contact => {
                    if (contact.type === "eitaa") {
                        html += `
                            <a href="${contact.val}" target="_blank" rel="noopener noreferrer" class="action-btn btn-eitaa-profile">
                                ارتباط در ایتا
                            </a>
                        `;
                    } else if (contact.type === "phone") {
                        const isLandline = contact.val.startsWith("028");
                        html += `
                            <div class="phone-item">
                                <span class="phone-number">${contact.val}</span>
                                <div class="btn-group">
                                    <a href="tel:${contact.val}" class="action-btn btn-call">تماس</a>
                                    ${!isLandline ? `<a href="sms:${contact.val}" class="action-btn btn-sms">پیامک</a>` : ''}
                                    <button type="button" class="action-btn btn-copy" onclick="copyPhone(this, '${contact.val}')">کپی</button>
                                </div>
                            </div>
                        `;
                    }
                });

                html += `
                        </div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        function copyPhone(btn, text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopiedFeedback(btn);
                }).catch(() => {
                    fallbackCopy(btn, text);
                });
            } else {
                fallbackCopy(btn, text);
            }
        }

        function fallbackCopy(btn, text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.setAttribute("readonly", "");
            textArea.style.position = "absolute";
            textArea.style.left = "-9999px";
            textArea.style.fontSize = "12pt";
            
            const isiOS = navigator.userAgent.match(/ipad|iphone/i);
            document.body.appendChild(textArea);
            
            if (isiOS) {
                const range = document.createRange();
                range.selectNodeContents(textArea);
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(range);
                textArea.setSelectionRange(0, 999999);
            } else {
                textArea.select();
            }
            
            try {
                document.execCommand('copy');
                showCopiedFeedback(btn);
            } catch (err) {
                console.error('Copy failed', err);
            }
            document.body.removeChild(textArea);
        }

        function showCopiedFeedback(btn) {
            const originalText = btn.innerText;
            btn.innerText = "کپی شد";
            btn.classList.add("copied");
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove("copied");
            }, 2000);
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }
    </script>
</body>
</html>
