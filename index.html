<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه نمایش تصویر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(-45deg, #090114, #1c053a, #320966, #110224);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }

        .glitch-wrapper img {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
            display: block;
        }

        .glitch-base {
            position: relative;
            z-index: 1;
            animation: glitch-main 3.2s infinite;
        }

        .glitch-layer {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0;
        }

        .glitch-cyan {
            z-index: 2;
            filter: drop-shadow(-4px 0 0 #00f3ff) brightness(1.3);
            mix-blend-mode: screen;
            animation: glitch-slice-1 3.2s infinite;
        }

        .glitch-magenta {
            z-index: 3;
            filter: drop-shadow(4px 0 0 #ff0055) brightness(1.3);
            mix-blend-mode: screen;
            animation: glitch-slice-2 3.2s infinite;
        }

        @keyframes glitch-main {
            0%, 82%, 100% {
                transform: translate(0, 0) skew(0deg) scale(1);
                filter: none;
            }
            83% {
                transform: translate(-4px, 1px) skew(-3deg);
                filter: contrast(1.4) brightness(1.2);
            }
            85% {
                transform: translate(3px, -2px) skew(2deg) scale(1.03);
                filter: hue-rotate(45deg) contrast(1.6);
            }
            87% {
                transform: translate(0, 0) skew(0deg);
                filter: none;
            }
            91% {
                transform: translate(-3px, 2px) skew(4deg);
                filter: contrast(1.8) saturate(2);
            }
            93% {
                transform: translate(4px, -1px) skew(-2deg);
                filter: invert(0.15) contrast(1.5);
            }
            95% {
                transform: translate(0, 0) skew(0deg) scale(1);
                filter: none;
            }
        }

        @keyframes glitch-slice-1 {
            0%, 82%, 88%, 90%, 96%, 100% {
                opacity: 0;
                transform: translate(0, 0);
                clip-path: inset(0 0 0 0);
            }
            83% {
                opacity: 0.9;
                transform: translate(-10px, -2px) skew(-6deg);
                clip-path: inset(12% 0 65% 0);
            }
            85% {
                opacity: 0.95;
                transform: translate(8px, 2px) skew(4deg);
                clip-path: inset(45% 0 25% 0);
            }
            87% {
                opacity: 0.85;
                transform: translate(-6px, 0);
                clip-path: inset(75% 0 5% 0);
            }
            91% {
                opacity: 1;
                transform: translate(12px, -3px) skew(-8deg);
                clip-path: inset(20% 0 55% 0);
            }
            93% {
                opacity: 0.9;
                transform: translate(-9px, 1px);
                clip-path: inset(60% 0 15% 0);
            }
            95% {
                opacity: 0.8;
                transform: translate(5px, 0);
                clip-path: inset(5% 0 80% 0);
            }
        }

        @keyframes glitch-slice-2 {
            0%, 82%, 88%, 90%, 96%, 100% {
                opacity: 0;
                transform: translate(0, 0);
                clip-path: inset(0 0 0 0);
            }
            83% {
                opacity: 0.9;
                transform: translate(10px, 2px) skew(6deg);
                clip-path: inset(55% 0 15% 0);
            }
            85% {
                opacity: 0.95;
                transform: translate(-8px, -2px) skew(-4deg);
                clip-path: inset(15% 0 60% 0);
            }
            87% {
                opacity: 0.85;
                transform: translate(7px, 1px);
                clip-path: inset(35% 0 40% 0);
            }
            91% {
                opacity: 1;
                transform: translate(-12px, 3px) skew(8deg);
                clip-path: inset(68% 0 10% 0);
            }
            93% {
                opacity: 0.9;
                transform: translate(9px, -1px);
                clip-path: inset(10% 0 70% 0);
            }
            95% {
                opacity: 0.8;
                transform: translate(-6px, 0);
                clip-path: inset(42% 0 38% 0);
            }
        }
    </style>
</head>
<body>

    <div class="glitch-wrapper">
        <img src="image/a.webp" alt="تصویر" class="glitch-base">
        <img src="image/a.webp" alt="" class="glitch-layer glitch-cyan" aria-hidden="true">
        <img src="image/a.webp" alt="" class="glitch-layer glitch-magenta" aria-hidden="true">
    </div>

</body>
</html>
